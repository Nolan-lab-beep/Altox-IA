<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Régisseur — le chat IA que tu joues toi-même</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#12182B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>

<style>
  :root{
    --marquee-bg:#12182B; --marquee-panel:#1B2340; --marquee-panel-2:#232B4A;
    --marquee-gold:#E8B33D; --marquee-ivory:#F1EEE3; --marquee-rose:#3E2A3B; --marquee-muted:#8890B0;
    --stage-bg:#16181B; --stage-panel:#1F2226; --stage-panel-2:#26292E;
    --stage-amber:#FFB454; --stage-text:#E7E3DA; --stage-muted:#8B8F94; --stage-red:#E0654F;
    --serif:'Fraunces', Georgia, serif; --sans:'IBM Plex Sans', -apple-system, sans-serif; --mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%; font-family:var(--sans);}
  body{background:var(--marquee-bg); color:var(--marquee-ivory);}
  body.backstage{background:var(--stage-bg); color:var(--stage-text);}
  #app{min-height:100vh; display:flex; flex-direction:column; max-width:520px; margin:0 auto; position:relative;}
  button{font-family:var(--sans); cursor:pointer; border:none;}
  input, textarea{font-family:var(--sans);}
  ::selection{background:var(--marquee-gold); color:#12182B;}
  a{color:inherit;}

  .center-screen{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 24px; text-align:center; gap:16px;}
  .muted{color:var(--marquee-muted); font-size:13px; line-height:1.5;}
  .backstage .muted{color:var(--stage-muted);}
  .field{width:100%; max-width:320px; text-align:left;}
  .field label{display:block; font-size:12px; color:var(--marquee-muted); margin-bottom:6px;}
  .backstage .field label{color:var(--stage-muted);}
  .field input{width:100%; padding:12px 14px; border-radius:10px; border:1px solid rgba(255,255,255,.14); background:var(--marquee-panel); color:var(--marquee-ivory); font-size:15px;}
  .backstage .field input{background:var(--stage-panel-2); border-color:rgba(255,255,255,.1); color:var(--stage-text);}
  .field input:focus{outline:2px solid var(--marquee-gold); outline-offset:1px;}
  .backstage .field input:focus{outline-color:var(--stage-amber);}
  .btn-primary{background:var(--marquee-gold); color:#1A1305; font-weight:600; padding:13px 22px; border-radius:10px; font-size:15px; width:100%; max-width:320px;}
  .backstage .btn-primary{background:var(--stage-amber); color:#241503;}
  .btn-primary:disabled{opacity:.5; cursor:default;}
  .btn-ghost{background:transparent; color:var(--marquee-muted); font-size:13px; text-decoration:underline; padding:8px;}
  .backstage .btn-ghost{color:var(--stage-muted);}
  .link-small{background:none; color:var(--marquee-muted); font-size:12px; padding:6px; text-decoration:underline; position:fixed; bottom:10px; left:50%; transform:translateX(-50%); z-index:20;}

  .tabs{display:flex; gap:6px; background:var(--marquee-panel); border-radius:12px; padding:4px; width:100%; max-width:320px;}
  .tab-btn{flex:1; padding:9px; border-radius:9px; background:transparent; color:var(--marquee-muted); font-size:13.5px; font-weight:500;}
  .tab-btn.active{background:var(--marquee-gold); color:#1A1305;}

  .marquee{padding:22px 20px 10px; text-align:center; position:relative; border-bottom:1px solid rgba(255,255,255,.08);}
  .bulbs{display:flex; justify-content:center; gap:7px; margin-bottom:10px;}
  .bulb{width:6px; height:6px; border-radius:50%; background:#4A4426; box-shadow:0 0 0 rgba(232,179,61,0);}
  .bulb.on{background:var(--marquee-gold); box-shadow:0 0 8px var(--marquee-gold);}
  .bulb.pulse{animation:bulbpulse 1.4s ease-in-out infinite;}
  .bulb:nth-child(2n).pulse{animation-delay:.2s;} .bulb:nth-child(3n).pulse{animation-delay:.4s;}
  @keyframes bulbpulse{0%,100%{opacity:.35;} 50%{opacity:1;}}
  .ai-name{font-family:var(--serif); font-size:28px; font-weight:600; letter-spacing:.5px; margin:0;}
  .ai-tag{font-size:12px; color:var(--marquee-muted); margin-top:4px;}

  .notif-banner{margin:10px 16px 0; padding:10px 12px; border-radius:10px; background:var(--marquee-panel-2); display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:12.5px;}
  .backstage .notif-banner{background:var(--stage-panel-2);}
  .notif-banner button{background:var(--marquee-gold); color:#1A1305; font-size:12px; padding:6px 10px; border-radius:7px; white-space:nowrap;}
  .backstage .notif-banner button{background:var(--stage-amber); color:#241503;}

  .thread{flex:1; overflow-y:auto; padding:18px 16px; display:flex; flex-direction:column; gap:12px;}
  .bubble-row{display:flex;}
  .bubble-row.me{justify-content:flex-end;}
  .bubble{max-width:78%; padding:11px 14px; border-radius:16px; font-size:14.5px; line-height:1.45; white-space:pre-wrap;}
  .bubble img{max-width:100%; border-radius:10px; display:block;}
  .bubble.other{background:var(--marquee-panel-2); border-bottom-left-radius:4px;}
  .bubble.me{background:var(--marquee-rose); border-bottom-right-radius:4px;}
  .backstage .bubble.other{background:var(--stage-panel-2); border-bottom-left-radius:4px;}
  .backstage .bubble.me{background:#3A2E1A; border-bottom-right-radius:4px;}
  .bubble-time{font-size:10px; color:var(--marquee-muted); margin-top:4px;}
  .backstage .bubble-time{color:var(--stage-muted);}
  .thinking{font-size:12px; color:var(--marquee-gold); font-style:italic; padding:0 16px;}

  .composer{display:flex; gap:8px; padding:14px 16px; padding-bottom:calc(14px + env(safe-area-inset-bottom)); border-top:1px solid rgba(255,255,255,.08); background:var(--marquee-bg);}
  .backstage .composer{background:var(--stage-bg);}
  .composer textarea{flex:1; resize:none; border-radius:14px; padding:11px 14px; border:1px solid rgba(255,255,255,.14); background:var(--marquee-panel); color:var(--marquee-ivory); font-size:14.5px; max-height:100px;}
  .backstage .composer textarea{background:var(--stage-panel-2); border-color:rgba(255,255,255,.1); color:var(--stage-text);}
  .composer textarea:focus{outline:none; border-color:var(--marquee-gold);}
  .backstage .composer textarea:focus{border-color:var(--stage-amber);}
  .send-btn{width:44px; border-radius:12px; background:var(--marquee-gold); color:#1A1305; font-size:18px;}
  .backstage .send-btn{background:var(--stage-amber); color:#241503;}
  .send-btn:disabled{opacity:.4;}

  .console-header{padding:16px 18px; border-bottom:1px solid rgba(255,255,255,.08); display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .console-title{font-family:var(--mono); font-size:13px; letter-spacing:.5px; color:var(--stage-muted);}
  .icon-btn{background:var(--stage-panel-2); color:var(--stage-amber); width:32px; height:32px; border-radius:9px; font-size:14px; flex-shrink:0;}
  .conv-list{flex:1; overflow-y:auto; padding:6px 0;}
  .conv-row{display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid rgba(255,255,255,.06);}
  .conv-row:active{background:rgba(255,255,255,.04);}
  .conv-avatar{width:36px; height:36px; border-radius:50%; background:var(--stage-panel-2); display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:14px; flex-shrink:0;}
  .conv-info{flex:1; min-width:0;}
  .conv-name{font-size:14.5px; font-weight:500;}
  .conv-preview{font-size:12.5px; color:var(--stage-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .badge-pending{background:var(--stage-red); color:#1A0805; font-family:var(--mono); font-size:10px; padding:3px 7px; border-radius:20px; flex-shrink:0;}
  .empty-state{flex:1; display:flex; align-items:center; justify-content:center; color:var(--stage-muted); font-size:13px; padding:40px; text-align:center;}
  .back-btn{background:none; color:var(--stage-muted); font-size:14px; padding:6px 8px;}

  .thread-header{padding:14px 18px; border-bottom:1px solid rgba(255,255,255,.08); display:flex; align-items:center; gap:10px;}
  .thread-header .name{font-size:15px; font-weight:500; flex:1;}
  .delete-btn{background:none; color:var(--stage-red); font-size:12px; padding:6px;}

  .ai-assist-row{display:flex; gap:8px; padding:0 16px 10px;}
  .chip{font-family:var(--mono); font-size:11.5px; padding:7px 12px; border-radius:8px; background:var(--stage-panel-2); color:var(--stage-amber); border:1px solid rgba(255,180,84,.25);}
  .chip:disabled{opacity:.4;}
  .chip.draw{color:#7CC7FF; border-color:rgba(124,199,255,.25);}

  .modal-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:flex-end; justify-content:center; z-index:50;}
  .modal-sheet{background:var(--stage-panel); width:100%; max-width:520px; border-radius:18px 18px 0 0; padding:16px; display:flex; flex-direction:column; gap:10px; max-height:80vh; overflow-y:auto;}
  body:not(.backstage) .modal-sheet{background:var(--marquee-panel);}
  .modal-sheet h4{margin:0; font-size:14px; font-family:var(--mono); color:var(--stage-muted); font-weight:400;}
  canvas{background:#fff; border-radius:10px; touch-action:none; width:100%; height:260px;}
  .draw-tools{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .swatch{width:26px; height:26px; border-radius:50%; border:2px solid transparent;}
  .swatch.active{border-color:var(--stage-amber);}
  .modal-actions{display:flex; gap:8px;}
  .modal-actions button{flex:1; padding:11px; border-radius:10px; font-size:13.5px;}
  .btn-cancel{background:var(--stage-panel-2); color:var(--stage-text);}
  .btn-send{background:var(--stage-amber); color:#241503; font-weight:600;}

  .help-item{width:100%; text-align:left; background:none; color:inherit; padding:13px 6px; font-size:14.5px; border-bottom:1px solid rgba(255,255,255,.07); display:flex; align-items:center; gap:10px;}
  .help-item:last-child{border-bottom:none;}
  .help-item.danger{color:var(--stage-red);}
  .help-textarea{width:100%; min-height:100px; border-radius:10px; padding:12px; border:1px solid rgba(255,255,255,.14); background:var(--stage-panel-2); color:var(--stage-text); font-size:14px; resize:vertical;}
  body:not(.backstage) .help-textarea{background:var(--marquee-panel-2); color:var(--marquee-ivory);}

  .spinner{width:14px; height:14px; border-radius:50%; border:2px solid rgba(255,255,255,.25); border-top-color:currentColor; animation:spin .7s linear infinite; display:inline-block; vertical-align:middle;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .toast{position:fixed; bottom:70px; left:50%; transform:translateX(-50%); background:#000; color:#fff; padding:10px 16px; border-radius:20px; font-size:12.5px; z-index:60; opacity:.95; max-width:85%; text-align:center;}
  code{background:rgba(255,255,255,.08); padding:1px 5px; border-radius:4px; font-family:var(--mono); font-size:12px;}
  .err{color:var(--stage-red); min-height:16px; font-size:12.5px; max-width:320px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   1) CONFIGURATION — colle ici la config de TON projet Firebase
   (Console Firebase → Paramètres du projet → Tes applications → SDK config)
   Voir README.md pour la marche à suivre pas à pas (gratuit, 5 min).
   Active aussi "Authentication → Sign-in method → E-mail/Mot de passe".
   ============================================================ */
const firebaseConfig = {

  apiKey: "AIzaSyBM1NbSfQpQJZAYVqTcoL7xvTyDvSFpv2c",

  authDomain: "altox-7c048.firebaseapp.com",

  databaseURL: "https://altox-7c048-default-rtdb.europe-west1.firebasedatabase.app",

  projectId: "altox-7c048",

  storageBucket: "altox-7c048.firebasestorage.app",

  messagingSenderId: "986483222197",

  appId: "1:986483222197:web:cd92174af9e4da5cb340fc",

  measurementId: "G-1MC84YG81K"

};


const OPERATOR_PASSCODE = "100823"; // change ce mot de passe si tu veux

// Clé VAPID pour les notifications push réelles (optionnel).
// Console Firebase → Paramètres du projet → Cloud Messaging → Web Push certificates → Générer une paire de clés.
const VAPID_KEY = "COLLE_TA_CLE_VAPID_ICI";
/* ============================================================ */

const CONFIG_MISSING = firebaseConfig.apiKey === "COLLE_TA_CLE_ICI";
const VAPID_MISSING = VAPID_KEY === "COLLE_TA_CLE_VAPID_ICI";
let db = null, auth = null;
if(!CONFIG_MISSING){
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  // Force une méthode de connexion plus compatible (certains antivirus/pare-feux/
  // extensions bloquent la connexion par défaut de Firestore, causant des rechargements
  // en boucle sans jamais aboutir).
  db.settings({ experimentalAutoDetectLongPolling: true });
  auth = firebase.auth();
}

const S = {
  view: 'loading', authMode:'signup',
  myUid: null, myConv: null,
  dashboard: [], dashPrevCounts: new Map(),
  openConvUid: null,
  drawColor: '#16181B',
  unsubClient: null, unsubDash: null, unsubThread: null,
  authInitialHandled: false,
};

const app = document.getElementById('app');
function setBodyTheme(theme){ document.body.className = theme; }
function esc(s){ return (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function timeStr(ts){ return new Date(ts).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}); }
function showToast(msg){
  const t = document.createElement('div'); t.className='toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2600);
}
function unsubAll(){
  [S.unsubClient, S.unsubDash, S.unsubThread].forEach(u => { if(u) u(); });
  S.unsubClient = S.unsubDash = S.unsubThread = null;
}

/* ---------------- Firestore helpers ---------------- */
const convRef = (uid) => db.collection('conversations').doc(uid);
async function getConv(uid){
  try{ const d = await convRef(uid).get(); return d.exists ? d.data() : null; }catch(e){ return null; }
}
async function saveConv(conv){
  try{ await convRef(conv.uid).set(conv); return true; }
  catch(e){ showToast("Erreur de sauvegarde, réessaie."); return false; }
}
async function deleteConv(uid){
  try{ await convRef(uid).delete(); }catch(e){}
}

/* ---------------- notifications ---------------- */
function notifBanner(context){
  if(typeof Notification === 'undefined' || Notification.permission !== 'default') return '';
  return `<div class="notif-banner">
      <span>🔔 Recevoir une alerte quand un message arrive ?</span>
      <button onclick="enableNotifs('${context}')">Activer</button>
    </div>`;
}
async function enableNotifs(context){
  try{
    const perm = await Notification.requestPermission();
    if(perm === 'granted') await registerPushToken(context);
    showToast(perm==='granted' ? "Notifications activées." : "Notifications refusées.");
  }catch(e){ showToast("Erreur d'activation des notifications."); }
  render();
}
async function registerPushToken(context){
  // Enregistre un jeton push réel (reçu même app fermée). Sans clé VAPID configurée,
  // seules les alertes "locales" (onglet ouvert en arrière-plan) fonctionneront.
  if(CONFIG_MISSING || VAPID_MISSING) return;
  try{
    const messaging = firebase.messaging();
    const reg = S.swRegistration || await navigator.serviceWorker.ready;
    const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
    if(!token) return;
    if(context === 'client' && S.myUid){
      await convRef(S.myUid).update({ fcmToken: token });
      if(S.myConv) S.myConv.fcmToken = token;
    } else if(context === 'operator'){
      await db.collection('operatorTokens').doc(token).set({ token, ts: Date.now() });
    }
  }catch(e){ /* le jeton push est optionnel, les alertes locales suffisent en secours */ }
}
async function notifyOperators(username, bodyText){
  if(CONFIG_MISSING || VAPID_MISSING) return;
  try{
    const snap = await db.collection('operatorTokens').get();
    const tokens = snap.docs.map(d => d.id);
    if(!tokens.length) return;
    await fetch('/api/notify', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ tokens, title:'Nouveau message', body: `${username} : ${bodyText}` })
    });
  }catch(e){}
}
async function notifyClient(conv, bodyText){
  if(CONFIG_MISSING || VAPID_MISSING || !conv.fcmToken) return;
  try{
    await fetch('/api/notify', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ tokens:[conv.fcmToken], title: conv.aiName, body: bodyText })
    });
  }catch(e){}
}
function maybeNotify(title, body){
  if(typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  if(!document.hidden) return;
  try{ new Notification(title, {body}); }catch(e){}
}

/* ---------------- init / auth ---------------- */
async function init(){
  if(CONFIG_MISSING){ S.view = 'setup-needed'; render(); return; }
  if('serviceWorker' in navigator){
    try{ S.swRegistration = await navigator.serviceWorker.register('./sw.js'); }catch(e){}
  }
  auth.onAuthStateChanged(async (user) => {
    if(user){
      await loadClientSession(user);
    } else if(!['operator-gate','operator-dashboard','operator-thread'].includes(S.view)){
      unsubAll();
      S.view = 'auth'; render();
    }
    S.authInitialHandled = true;
  });
}

async function loadClientSession(user){
  S.myUid = user.uid;
  const conv = await getConv(user.uid);
  if(!conv){ showToast("Profil introuvable."); return; }
  S.myConv = conv; S.view = 'client-chat'; render(); listenClient();
}

/* ---------------- RENDER ROOT ---------------- */
function render(){
  if(S.view === 'loading'){ setBodyTheme('stage'); app.innerHTML = `<div class="center-screen"><span class="spinner"></span></div>`; return; }
  if(S.view === 'setup-needed') return renderSetupNeeded();
  if(S.view === 'auth') return renderAuth();
  if(S.view === 'client-chat') return renderClientChat();
  if(S.view === 'operator-gate') return renderOperatorGate();
  if(S.view === 'operator-dashboard') return renderOperatorDashboard();
  if(S.view === 'operator-thread') return renderOperatorThread();
}

function renderSetupNeeded(){
  setBodyTheme('stage');
  app.innerHTML = `
    <div class="center-screen">
      <h1 style="font-family:var(--serif); font-size:24px; margin:0;">Encore une étape</h1>
      <p class="muted" style="max-width:320px;">Il manque la config Firebase dans <code>index.html</code> (la partie <code>firebaseConfig</code> tout en haut du script). Suis le <b>README.md</b> fourni — 5 minutes, gratuit — puis recharge la page.</p>
    </div>`;
}

/* ---------------- AUTH SCREEN ---------------- */
function renderAuth(){
  setBodyTheme('stage');
  const isSignup = S.authMode === 'signup';
  app.innerHTML = `
    <div class="center-screen">
      <div class="bulbs">${[1,2,3,4,5].map(()=>'<div class="bulb on"></div>').join('')}</div>
      <h1 style="font-family:var(--serif); font-size:26px; margin:0;">Bienvenue</h1>
      <p class="muted">Crée un compte ou connecte-toi pour discuter.</p>
      <div class="tabs">
        <button class="tab-btn ${isSignup?'active':''}" onclick="S.authMode='signup'; render();">Créer un compte</button>
        <button class="tab-btn ${!isSignup?'active':''}" onclick="S.authMode='login'; render();">Se connecter</button>
      </div>
      ${isSignup ? `
        <div class="field"><label>Pseudo</label><input id="auth-username" maxlength="20" placeholder="ex : lucie92"></div>
        <div class="field"><label>Nom de l'IA</label><input id="auth-ai" maxlength="20" placeholder="ex : Nova" value="Nova"></div>
        <div class="field"><label>E-mail</label><input id="auth-email" type="email" placeholder="toi@exemple.com"></div>
        <div class="field"><label>Numéro de téléphone (optionnel)</label><input id="auth-phone" type="tel" placeholder="06 12 34 56 78"></div>
        <div class="field"><label>Mot de passe (6 caractères min.)</label><input id="auth-password" type="password" placeholder="••••••••"></div>
      ` : `
        <div class="field"><label>E-mail</label><input id="auth-email" type="email" placeholder="toi@exemple.com"></div>
        <div class="field"><label>Mot de passe</label><input id="auth-password" type="password" placeholder="••••••••"></div>
      `}
      <p class="err" id="auth-error"></p>
      <button class="btn-primary" id="auth-btn" onclick="${isSignup ? 'handleSignup()' : 'handleLogin()'}">${isSignup ? 'Commencer à discuter' : 'Se connecter'}</button>
    </div>
    <button class="link-small" onclick="openHelpSheet()">Centre d'aide</button>`;
}

function authErr(code){
  const map = {
    'auth/email-already-in-use': 'Un compte existe déjà avec cet e-mail.',
    'auth/invalid-email': "Adresse e-mail invalide.",
    'auth/weak-password': 'Mot de passe trop court (6 caractères min).',
    'auth/user-not-found': 'Aucun compte avec cet e-mail.',
    'auth/wrong-password': 'Mot de passe incorrect.',
    'auth/invalid-credential': 'E-mail ou mot de passe incorrect.',
    'auth/too-many-requests': 'Trop de tentatives, réessaie plus tard.',
  };
  return map[code] || "Une erreur est survenue, réessaie.";
}

async function handleSignup(){
  const username = document.getElementById('auth-username').value.trim();
  const aiName = document.getElementById('auth-ai').value.trim() || 'Nova';
  const email = document.getElementById('auth-email').value.trim();
  const phone = document.getElementById('auth-phone').value.trim();
  const password = document.getElementById('auth-password').value;
  const errEl = document.getElementById('auth-error');
  const btn = document.getElementById('auth-btn');
  if(!username || !email || !password){ errEl.textContent = 'Remplis au moins pseudo, e-mail et mot de passe.'; return; }
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  try{
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    const conv = {
      uid: cred.user.uid, username, email, phone, aiName, status:'answered',
      messages:[{id:crypto.randomUUID(), role:'ai', type:'text', content:`Salut ${username}, je suis ${aiName}. Pose-moi une question !`, ts:Date.now()}]
    };
    await saveConv(conv);
    await loadClientSession(cred.user);
  }catch(e){
    errEl.textContent = authErr(e.code);
    btn.disabled = false; btn.textContent = 'Commencer à discuter';
  }
}

async function handleLogin(){
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const errEl = document.getElementById('auth-error');
  const btn = document.getElementById('auth-btn');
  if(!email || !password){ errEl.textContent = 'Renseigne ton e-mail et ton mot de passe.'; return; }
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  try{
    const cred = await auth.signInWithEmailAndPassword(email, password);
    await loadClientSession(cred.user);
  }catch(e){
    errEl.textContent = authErr(e.code);
    btn.disabled = false; btn.textContent = 'Se connecter';
  }
}

async function handleLogout(){
  closeHelpSheet();
  unsubAll();
  await auth.signOut();
  S.myUid = null; S.myConv = null; S.view = 'auth'; S.authMode='login';
  render();
}

/* ---------------- CLIENT CHAT (temps réel) ---------------- */
function listenClient(){
  unsubAll();
  S.unsubClient = convRef(S.myUid).onSnapshot((doc) => {
    if(!doc.exists) return;
    const fresh = doc.data();
    if(S.myConv && fresh.messages.length > S.myConv.messages.length){
      const last = fresh.messages[fresh.messages.length-1];
      if(last.role === 'ai') maybeNotify(fresh.aiName, last.type==='image' ? 'a envoyé un dessin' : last.content);
    }
    S.myConv = fresh;
    if(S.view === 'client-chat') renderClientChat();
  });
}

function renderClientChat(){
  setBodyTheme('stage');
  const conv = S.myConv;
  const pending = conv.status === 'pending';
  app.innerHTML = `
    <div class="marquee">
      <div class="bulbs">${[1,2,3,4,5].map(()=>`<div class="bulb on ${pending?'pulse':''}"></div>`).join('')}</div>
      <p class="ai-name">${esc(conv.aiName)}</p>
      <p class="ai-tag">connecté(e) en tant que ${esc(conv.username)}</p>
    </div>
    ${notifBanner('client')}
    <div class="thread" id="thread">
      ${conv.messages.map(m => bubbleHTML(m, m.role==='user')).join('')}
    </div>
    ${pending ? `<p class="thinking">${esc(conv.aiName)} est en train d'écrire…</p>` : ''}
    <div class="composer">
      <textarea id="client-input" rows="1" placeholder="Écris ton message…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendClientMessage();}"></textarea>
      <button class="send-btn" onclick="sendClientMessage()">↑</button>
    </div>
    <button class="link-small" onclick="openHelpSheet()">Centre d'aide</button>`;
  const th = document.getElementById('thread'); if(th) th.scrollTop = th.scrollHeight;
}

function bubbleHTML(m, mine){
  const body = m.type === 'image' ? `<img src="${m.content}" alt="dessin">` : esc(m.content);
  return `<div class="bubble-row ${mine?'me':''}">
      <div>
        <div class="bubble ${mine?'me':'other'}">${body}</div>
        <div class="bubble-time" style="text-align:${mine?'right':'left'}">${timeStr(m.ts)}</div>
      </div>
    </div>`;
}

async function sendClientMessage(){
  const input = document.getElementById('client-input');
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  S.myConv.messages.push({id:crypto.randomUUID(), role:'user', type:'text', content:text, ts:Date.now()});
  S.myConv.status = 'pending';
  renderClientChat();
  await saveConv(S.myConv);
  notifyOperators(S.myConv.username, text);
}

/* ---------------- HELP CENTER ---------------- */
function openHelpSheet(){
  const loggedIn = !!S.myUid;
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop'; backdrop.id = 'help-backdrop';
  backdrop.innerHTML = `
    <div class="modal-sheet">
      <h4>centre d'aide</h4>
      <button class="help-item" onclick="comingSoon('FAQ')">❓ Questions fréquentes</button>
      <button class="help-item" onclick="openBugReport()">🐞 Signaler un bug</button>
      <button class="help-item" onclick="comingSoon('Support')">💬 Contacter le support</button>
      <button class="help-item" onclick="comingSoon('Conditions d\'utilisation')">📄 Conditions d'utilisation</button>
      <button class="help-item" onclick="comingSoon('Confidentialité')">🔒 Confidentialité</button>
      ${loggedIn ? `<button class="help-item danger" onclick="handleLogout()">🚪 Se déconnecter</button>` : ''}
      <button class="help-item" onclick="closeHelpSheet(); S.view='operator-gate'; render();">🎭 Accès équipe</button>
      <button class="btn-cancel" style="border-radius:10px; padding:11px; margin-top:4px;" onclick="closeHelpSheet()">Fermer</button>
    </div>`;
  document.body.appendChild(backdrop);
}
function closeHelpSheet(){ const b = document.getElementById('help-backdrop'); if(b) b.remove(); }
function comingSoon(name){ showToast(name + " — bientôt disponible."); }

function openBugReport(){
  closeHelpSheet();
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop'; backdrop.id = 'bug-backdrop';
  backdrop.innerHTML = `
    <div class="modal-sheet">
      <h4>signaler un bug</h4>
      <textarea id="bug-text" class="help-textarea" placeholder="Décris ce qui ne fonctionne pas…"></textarea>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeBugReport()">annuler</button>
        <button class="btn-send" id="bug-send" onclick="sendBugReport()">envoyer</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
}
function closeBugReport(){ const b = document.getElementById('bug-backdrop'); if(b) b.remove(); }
async function sendBugReport(){
  const text = document.getElementById('bug-text').value.trim();
  if(!text) return;
  const btn = document.getElementById('bug-send');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  try{
    await db.collection('bugreports').add({ text, from: S.myUid || 'anonyme', ts: Date.now() });
    showToast("Merci, c'est envoyé !");
    closeBugReport();
  }catch(e){
    showToast("Échec de l'envoi, réessaie.");
    btn.disabled = false; btn.textContent = 'envoyer';
  }
}

/* ---------------- OPERATOR GATE ---------------- */
function renderOperatorGate(){
  setBodyTheme('backstage');
  app.innerHTML = `
    <div class="center-screen">
      <p class="muted" style="font-family:var(--mono); letter-spacing:1px; text-transform:uppercase; font-size:11px;">accès restreint</p>
      <h1 style="font-family:var(--serif); font-size:24px; margin:0;">Coulisses</h1>
      <div class="field"><label>Code d'accès</label><input id="passcode" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')checkPasscode()"></div>
      <p class="err" id="gate-error"></p>
      <button class="btn-primary" onclick="checkPasscode()">Entrer</button>
      <button class="btn-ghost" onclick="S.view = S.myUid ? 'client-chat' : 'auth'; render();">← retour</button>
      <p class="muted" style="max-width:280px;">Note : ce code n'est qu'un filtre simple, pas une vraie sécurité — n'y mets rien de confidentiel.</p>
    </div>`;
}
function checkPasscode(){
  const val = document.getElementById('passcode').value;
  if(val === OPERATOR_PASSCODE){
    S.view = 'operator-dashboard'; render(); listenDashboard();
  } else {
    document.getElementById('gate-error').textContent = 'Code incorrect.';
  }
}

/* ---------------- OPERATOR DASHBOARD (temps réel) ---------------- */
function listenDashboard(){
  if(S.unsubDash) S.unsubDash();
  S.unsubDash = db.collection('conversations').onSnapshot((snap) => {
    const convs = snap.docs.map(d => d.data());
    convs.forEach(c => {
      const len = c.messages.length;
      const prev = S.dashPrevCounts.get(c.uid);
      if(prev !== undefined && len > prev){
        const last = c.messages[len-1];
        if(last.role === 'user') maybeNotify('Nouveau message', `${c.username} : ${last.type==='image' ? 'a envoyé un dessin' : last.content}`);
      }
      S.dashPrevCounts.set(c.uid, len);
    });
    convs.sort((a,b) => {
      if(a.status==='pending' && b.status!=='pending') return -1;
      if(b.status==='pending' && a.status!=='pending') return 1;
      const at = a.messages[a.messages.length-1]?.ts||0, bt = b.messages[b.messages.length-1]?.ts||0;
      return bt-at;
    });
    S.dashboard = convs;
    if(S.view === 'operator-dashboard') renderOperatorDashboard();
  });
}

function renderOperatorDashboard(){
  setBodyTheme('backstage');
  const rows = S.dashboard.map(c => {
    const last = c.messages[c.messages.length-1];
    const preview = last ? (last.type==='image' ? '📎 dessin' : last.content) : '';
    return `<div class="conv-row" onclick="openThread('${c.uid}')">
      <div class="conv-avatar">${esc(c.username[0]||'?').toUpperCase()}</div>
      <div class="conv-info">
        <div class="conv-name">${esc(c.username)} <span class="muted">→ ${esc(c.aiName)}</span></div>
        <div class="conv-preview">${esc(preview)}</div>
      </div>
      ${c.status==='pending' ? '<span class="badge-pending">nouveau</span>' : ''}
    </div>`;
  }).join('');
  app.innerHTML = `
    <div class="console-header">
      <span class="console-title">RÉGIE · ${S.dashboard.length} conversation(s)</span>
      <div style="display:flex; gap:8px; align-items:center;">
        ${typeof Notification!=='undefined' && Notification.permission==='default' ? `<button class="icon-btn" onclick="enableNotifs('operator')" title="Activer les notifications">🔔</button>` : ''}
        <button class="back-btn" onclick="unsubAll(); S.view = S.myUid ? 'client-chat' : 'auth'; render();">quitter</button>
      </div>
    </div>
    <div class="conv-list">${rows || "<div class=\"empty-state\">Personne n'a encore ouvert le rideau.<br>La liste se met à jour toute seule.</div>"}</div>`;
}

function openThread(uid){
  S.openConvUid = uid;
  S.view = 'operator-thread';
  render();
  listenThread();
}

/* ---------------- OPERATOR THREAD (temps réel) ---------------- */
function listenThread(){
  if(S.unsubThread) S.unsubThread();
  S.unsubThread = convRef(S.openConvUid).onSnapshot((doc) => {
    if(!doc.exists) return;
    const idx = S.dashboard.findIndex(c => c.uid === S.openConvUid);
    if(idx>-1) S.dashboard[idx] = doc.data(); else S.dashboard.push(doc.data());
    if(S.view === 'operator-thread') renderOperatorThread();
  });
}

function renderOperatorThread(){
  setBodyTheme('backstage');
  const conv = S.dashboard.find(c => c.uid === S.openConvUid);
  if(!conv){ app.innerHTML = `<div class="center-screen"><span class="spinner"></span></div>`; return; }
  app.innerHTML = `
    <div class="thread-header">
      <button class="back-btn" onclick="if(S.unsubThread)S.unsubThread(); S.view='operator-dashboard'; render(); listenDashboard();">←</button>
      <span class="name">${esc(conv.username)} <span class="muted">parle à ${esc(conv.aiName)}</span></span>
      <button class="delete-btn" onclick="removeThread('${conv.uid}')">supprimer</button>
    </div>
    <div class="thread" id="thread">
      ${conv.messages.map(m => bubbleHTML(m, m.role==='ai')).join('')}
    </div>
    <div class="ai-assist-row">
      <button class="chip" id="assist-btn" onclick="requestAISuggestion()">✨ suggérer avec l'IA</button>
      <button class="chip draw" onclick="openDrawModal()">🖌 répondre par un dessin</button>
    </div>
    <div class="composer">
      <textarea id="op-input" rows="1" placeholder="Réponds en tant que ${esc(conv.aiName)}…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendOperatorMessage();}"></textarea>
      <button class="send-btn" onclick="sendOperatorMessage()">↑</button>
    </div>`;
  const th = document.getElementById('thread'); if(th) th.scrollTop = th.scrollHeight;
}

async function removeThread(uid){
  const conv = S.dashboard.find(c => c.uid === uid);
  if(!confirm(`Supprimer la conversation avec ${conv ? conv.username : ''} ?`)) return;
  if(S.unsubThread) S.unsubThread();
  await deleteConv(uid);
  S.view = 'operator-dashboard'; render(); listenDashboard();
}

async function sendOperatorMessage(){
  const input = document.getElementById('op-input');
  const text = input.value.trim();
  if(!text) return;
  const conv = S.dashboard.find(c => c.uid === S.openConvUid);
  if(!conv) return;
  conv.messages.push({id:crypto.randomUUID(), role:'ai', type:'text', content:text, ts:Date.now()});
  conv.status = 'answered';
  input.value = '';
  renderOperatorThread();
  await saveConv(conv);
  notifyClient(conv, text);
}

async function requestAISuggestion(){
  const btn = document.getElementById('assist-btn');
  const conv = S.dashboard.find(c => c.uid === S.openConvUid);
  if(!conv) return;
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> réflexion…';
  try{
    const history = conv.messages.filter(m=>m.type==='text').map(m=>({
      role: m.role==='user' ? 'user' : 'assistant', content: m.content
    }));
    if(history.length===0 || history[history.length-1].role!=='user'){
      showToast("Attends un message du visiteur d'abord.");
      btn.disabled=false; btn.innerHTML="✨ suggérer avec l'IA"; return;
    }
    const response = await fetch("/api/suggest", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        system: `Tu es ${conv.aiName}, un assistant IA sympathique dans une messagerie de chat. Réponds de façon naturelle, concise et utile au dernier message de l'utilisateur, comme le ferait un assistant IA. N'ajoute pas de balises ni de préambule.`,
        messages: history
      })
    });
    const data = await response.json();
    const text = (data.content||[]).map(b=>b.text||'').join('\n').trim();
    const input = document.getElementById('op-input');
    if(input) input.value = text || "(l'IA n'a rien renvoyé, réessaie)";
  }catch(e){
    showToast("La suggestion IA a échoué — vérifie ta connexion, ou ta clé API si tu en utilises une côté serveur.");
  }
  btn.disabled = false; btn.innerHTML = "✨ suggérer avec l'IA";
}

/* ---------------- DRAW MODAL (paint-like) ---------------- */
function openDrawModal(){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop'; backdrop.id = 'draw-backdrop';
  backdrop.innerHTML = `
    <div class="modal-sheet">
      <h4>dessine ta réponse</h4>
      <canvas id="paint-canvas" width="480" height="320"></canvas>
      <div class="draw-tools">
        ${['#16181B','#E0654F','#FFB454','#7CC7FF','#7CFFB2','#F1EEE3'].map(c=>
          `<div class="swatch ${c===S.drawColor?'active':''}" style="background:${c}" onclick="setDrawColor('${c}', event)"></div>`).join('')}
        <button class="chip" onclick="clearCanvas()">effacer</button>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeDrawModal()">annuler</button>
        <button class="btn-send" onclick="sendDrawing()">envoyer le dessin</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  setupCanvas();
}
function closeDrawModal(){ const b = document.getElementById('draw-backdrop'); if(b) b.remove(); }
function setDrawColor(c, event){
  S.drawColor = c; const cv=document.getElementById('paint-canvas'); if(cv) cv._ctx.strokeStyle=c;
  document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));
  if(event) event.target.classList.add('active');
}
function clearCanvas(){ const cv=document.getElementById('paint-canvas'); if(cv) cv._ctx.clearRect(0,0,cv.width,cv.height); }
function setupCanvas(){
  const cv = document.getElementById('paint-canvas');
  const ctx = cv.getContext('2d');
  cv._ctx = ctx;
  ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.strokeStyle = S.drawColor;
  let drawing = false, last = null;
  function pos(e){
    const r = cv.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x:(p.clientX-r.left)*(cv.width/r.width), y:(p.clientY-r.top)*(cv.height/r.height) };
  }
  function start(e){ drawing=true; last=pos(e); e.preventDefault(); }
  function move(e){
    if(!drawing) return;
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    last = p; e.preventDefault();
  }
  function end(){ drawing=false; }
  cv.addEventListener('mousedown', start); cv.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
  cv.addEventListener('touchstart', start); cv.addEventListener('touchmove', move); cv.addEventListener('touchend', end);
}
async function sendDrawing(){
  const cv = document.getElementById('paint-canvas');
  const dataUrl = cv.toDataURL('image/png');
  const conv = S.dashboard.find(c => c.uid === S.openConvUid);
  if(!conv) return;
  conv.messages.push({id:crypto.randomUUID(), role:'ai', type:'image', content:dataUrl, ts:Date.now()});
  conv.status = 'answered';
  closeDrawModal();
  renderOperatorThread();
  await saveConv(conv);
  notifyClient(conv, 'a envoyé un dessin');
}

init();
</script>
